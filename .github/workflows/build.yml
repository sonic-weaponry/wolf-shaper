# Builds the Wolf Shaper VST3 with DPF's Makefiles (macOS universal, Linux x64, Windows x64) and runs the checks in
# ci/ on our build and on the official v1.0.2 release side by side: class IDs, parameters, states, opening the plugin
# the way a host does, on macOS its editor window, and on macOS and Windows the sound. The macOS installer is built,
# rehearsed with throwaway signing identities and installed on the runner; started by hand with sign=true, the
# macos-release job also signs, notarizes and staples it. See ci/README.md.
name: build

on:
  push:
    branches: ['sw/**']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign, notarize and staple the macOS installer (the macos-release job, mac-release environment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A signing run has its own group, so a push doesn't cancel it while Apple checks the installer.
  group: build-${{ github.ref }}-${{ inputs.sign && 'sign' || 'checks' }}
  cancel-in-progress: true

env:
  # Only the VST3. Every format links the same plugin objects, so leaving the others out doesn't change the VST3.
  VST3_ONLY: BUILD_VST3=true BUILD_LV2=false BUILD_VST2=false BUILD_CLAP=false BUILD_JACK=false BUILD_DSSI=false BUILD_LADSPA=false
  VST3_SDK_TAG: v3.8.1_build_84
  OFFICIAL_RELEASE: v1.0.2
  # The macOS installer's package version (packaging/macos). The plugin itself keeps reporting 1.0.2.
  PKG_VERSION: 1.0.2.1
  # sha256 of the official v1.0.2 binaries the checks load. The Windows one is also the reference install's.
  OFFICIAL_WINDOWS_SHA256: 35ad3db823fba86dfd1f35b827f1285496ce306695de483c54ac447ce6e2d699
  OFFICIAL_MAC_SHA256: a0698fcfdf6f99a3a611d686ca72f3d81f5f4b0ec903d46cfac135654c12a95a
  OFFICIAL_LINUX_SHA256: b54abee0ff9fe46313bda15a5ab8c758832c0e0741e9d30c49c4a62ba98f4e0f

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      # The macos-release job signs exactly the program this job built and checked.
      binary_sha256: ${{ steps.slices.outputs.binary_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      # How much of the editor's picture may differ from the official v1.0.2's picture of the same state: the share of
      # pixels with a color channel more than 1/8 of full scale apart (ci/README.md). Measured: none differ at all (CI
      # run 40795830121). 0.01 % allows about 40 of the 404,482 pixels.
      GUI_MAX_DIFFERENT_SHARE: '0.0001'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Runner and toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          clang --version | head -n 1
          git -C dpf log -1 --format='dpf %H %s'
          system_profiler SPDisplaysDataType | sed -n '1,40p'

      # The flags DISTRHO/dpf-makefile-action used for the official v1.0.2 macOS release (target macos-universal).
      - name: Build the VST3 (universal)
        id: build
        env:
          CFLAGS: -arch x86_64 -arch arm64 -DMAC_OS_X_VERSION_MAX_ALLOWED=MAC_OS_X_VERSION_10_12 -DMAC_OS_X_VERSION_MIN_REQUIRED=MAC_OS_X_VERSION_10_12 -mmacosx-version-min=10.12 -mtune=generic -msse -msse2
          CXXFLAGS: -arch x86_64 -arch arm64 -DMAC_OS_X_VERSION_MAX_ALLOWED=MAC_OS_X_VERSION_10_12 -DMAC_OS_X_VERSION_MIN_REQUIRED=MAC_OS_X_VERSION_10_12 -mmacosx-version-min=10.12 -mtune=generic -msse -msse2
          LDFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.12
        run: |
          make $VST3_ONLY features
          make $VST3_ONLY NOOPT=true -j"$(sysctl -n hw.logicalcpu)" plugins

      - name: Check the binary holds both slices
        id: slices
        run: |
          B=bin/wolf-shaper.vst3/Contents/MacOS/wolf-shaper
          archs=$(lipo -archs "$B")
          echo "architectures: $archs"
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::no x86_64 slice"; exit 1 ;; esac
          case " $archs " in *" arm64 "*) ;; *) echo "::error::no arm64 slice"; exit 1 ;; esac
          vtool -show-build "$B" | grep -E "architecture|minos|sdk" || true
          codesign -dv "$B" 2>&1 | grep -E "Format|Identifier|Signature" || true
          echo "--- files in the bundle"
          find bin/wolf-shaper.vst3 -type f
          shasum -a 256 "$B"
          echo "binary_sha256=$(shasum -a 256 "$B" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Build the check tool (universal)
        id: tool
        run: |
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3_pluginterfaces.git ci/vst3_check/sdk/pluginterfaces
          cmake -S ci/vst3_check -B ci/vst3_check/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ci/vst3_check/build --config Release
          lipo -archs ci/vst3_check/build/vst3_check

      - name: Get the official v1.0.2 macOS release
        id: official
        run: |
          mkdir -p official
          gh release download "$OFFICIAL_RELEASE" -R wolf-plugins/wolf-shaper -p wolf-shaper-v1.0.2-macos-universal.zip -D official
          cd official
          cmake -E tar xf wolf-shaper-v1.0.2-macos-universal.zip
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/wsdmg ./*.dmg
          pkgutil --expand-full /tmp/wsdmg/wolf-shaper-AudioPlugins.pkg pkg
          cp /tmp/wsdmg/wolf-shaper-AudioPlugins.pkg .
          hdiutil detach /tmp/wsdmg
          cp -R "$(find pkg/dpf-wolf-shaper-vst3bundles.pkg -type d -name wolf-shaper.vst3 | head -n 1)" ./wolf-shaper.vst3
          echo "--- files in the bundle"
          find wolf-shaper.vst3 -type f
          echo "$OFFICIAL_MAC_SHA256  wolf-shaper.vst3/Contents/MacOS/wolf-shaper" | shasum -a 256 -c

      - name: Checks, our build, arm64
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tool.outcome == 'success' }}
        run: bash ci/run_checks.sh ci/vst3_check/build/vst3_check bin/wolf-shaper.vst3 ours macos-arm64-ours

      - name: Checks, our build, x86_64 (Rosetta)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tool.outcome == 'success' }}
        run: bash ci/run_checks.sh ci/vst3_check/build/vst3_check bin/wolf-shaper.vst3 ours macos-x86_64-ours arch -x86_64

      - name: Checks, official v1.0.2, arm64
        if: ${{ !cancelled() && steps.official.outcome == 'success' && steps.tool.outcome == 'success' }}
        run: bash ci/run_checks.sh ci/vst3_check/build/vst3_check official/wolf-shaper.vst3 official macos-arm64-official

      - name: Checks, official v1.0.2, x86_64 (Rosetta)
        if: ${{ !cancelled() && steps.official.outcome == 'success' && steps.tool.outcome == 'success' }}
        run: bash ci/run_checks.sh ci/vst3_check/build/vst3_check official/wolf-shaper.vst3 official macos-x86_64-official arch -x86_64

      # The editor, opened in a window as a host does (public test states only). What it drew into its OpenGL buffer
      # is checked; the window is photographed for the record. This runner is a virtual machine without a GPU: OpenGL
      # there is Apple's software renderer and the window itself stays white for every build (ci/README.md). The
      # official v1.0.2 goes first so that ours can be compared with it.
      - name: GUI, official v1.0.2, arm64
        if: ${{ !cancelled() && steps.official.outcome == 'success' && steps.tool.outcome == 'success' }}
        timeout-minutes: 5
        run: bash ci/run_gui_checks.sh ci/vst3_check/build/vst3_check official/wolf-shaper.vst3 macos-arm64-official -

      - name: GUI, our build, arm64, compared with the official
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tool.outcome == 'success' }}
        timeout-minutes: 5
        run: bash ci/run_gui_checks.sh ci/vst3_check/build/vst3_check bin/wolf-shaper.vst3 macos-arm64-ours macos-arm64-official

      - name: GUI, official v1.0.2, x86_64 (Rosetta)
        if: ${{ !cancelled() && steps.official.outcome == 'success' && steps.tool.outcome == 'success' }}
        timeout-minutes: 5
        run: bash ci/run_gui_checks.sh ci/vst3_check/build/vst3_check official/wolf-shaper.vst3 macos-x86_64-official - arch -x86_64

      - name: GUI, our build, x86_64 (Rosetta), compared with the official
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tool.outcome == 'success' }}
        timeout-minutes: 5
        run: bash ci/run_gui_checks.sh ci/vst3_check/build/vst3_check bin/wolf-shaper.vst3 macos-x86_64-ours macos-x86_64-official arch -x86_64

      - name: GUI self-test (each GUI check must fail on a wrong picture)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tool.outcome == 'success' }}
        timeout-minutes: 5
        run: bash ci/self_test_gui.sh ci/vst3_check/build/vst3_check macos-arm64-ours bin/wolf-shaper.vst3

      # The sound (ci/README.md): the public test states through the official v1.0.2 and our build, at 44.1 and 48 kHz,
      # blocks of 512 and 64, on Apple Silicon and Intel (Rosetta). Each render: block 64 must equal block 512.
      - name: Test signal
        id: signal
        if: ${{ !cancelled() }}
        run: |
          python3 ci/make_test_signal.py sound-signal
          (cd sound-signal && shasum -a 256 -c ../ci/frozen/test-signal.sha256)

      - name: Sound, official v1.0.2, arm64
        if: ${{ !cancelled() && steps.official.outcome == 'success' && steps.tool.outcome == 'success' && steps.signal.outcome == 'success' }}
        run: bash ci/run_sound_checks.sh ci/vst3_check/build/vst3_check official/wolf-shaper.vst3 macos-arm64-official sound-signal sound-renders

      - name: Sound, our build, arm64
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tool.outcome == 'success' && steps.signal.outcome == 'success' }}
        run: bash ci/run_sound_checks.sh ci/vst3_check/build/vst3_check bin/wolf-shaper.vst3 macos-arm64-ours sound-signal sound-renders

      - name: Sound, official v1.0.2, x86_64 (Rosetta)
        if: ${{ !cancelled() && steps.official.outcome == 'success' && steps.tool.outcome == 'success' && steps.signal.outcome == 'success' }}
        run: bash ci/run_sound_checks.sh ci/vst3_check/build/vst3_check official/wolf-shaper.vst3 macos-x86_64-official sound-signal sound-renders arch -x86_64

      - name: Sound, our build, x86_64 (Rosetta)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tool.outcome == 'success' && steps.signal.outcome == 'success' }}
        run: bash ci/run_sound_checks.sh ci/vst3_check/build/vst3_check bin/wolf-shaper.vst3 macos-x86_64-ours sound-signal sound-renders arch -x86_64

      # Limits from the reviewed results (ci/README.md, "The sound"). Our arm64 slice is built without fused
      # multiply-adds and the official one with them, so that pair is reported, not limited: its reference is Windows
      # (the sound-compare job).
      - name: Sound, null tests on macOS
        if: ${{ !cancelled() && steps.signal.outcome == 'success' }}
        run: |
          r=sound-renders
          python3 ci/null_test.py --limit -100 --label "x86_64: our build against the official v1.0.2" --dirs $r/macos-x86_64-official $r/macos-x86_64-ours
          python3 ci/null_test.py --limit -100 --label "our build: x86_64 against arm64" --dirs $r/macos-arm64-ours $r/macos-x86_64-ours
          python3 ci/null_test.py --label "arm64: our build against the official v1.0.2 (report only)" --dirs $r/macos-arm64-official $r/macos-arm64-ours
          python3 ci/null_test.py --label "official v1.0.2: x86_64 against arm64 (report only)" --dirs $r/macos-arm64-official $r/macos-x86_64-official

      # Saved values under a decimal-comma C locale, which a host process shares with every plugin it loads
      # (ci/README.md). Our DPF reads saved values in the "C" locale (falkTX's fix), so our build must load and save
      # every public test state under de_DE.UTF-8 exactly as under "C", without a DPF assertion or warning.
      - name: Locale, de_DE.UTF-8, our build (arm64 and x86_64)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tool.outcome == 'success' }}
        run: |
          failed=0
          for launcher in "" "arch -x86_64"; do
            code=0
            out=$($launcher ci/vst3_check/build/vst3_check locale bin/wolf-shaper.vst3 de_DE.UTF-8 ci/frozen/states/*.vst3state 2>&1) || code=$?
            echo "::group::ours ${launcher:-arm64}"
            echo "$out"
            echo "::endgroup::"
            result=$(grep '^RESULT' <<<"$out" | tail -n 1) || true
            if [ "$code" -eq 0 ] && grep -q '^RESULT locale PASS' <<<"$result" &&
                ! grep -q -e 'assertion failure' -e 'DPF warning' <<<"$out"; then
              echo "ours ${launcher:-arm64}: PASS: $result"
            else
              echo "ours ${launcher:-arm64}: FAIL: $result"
              failed=1
            fi
          done
          exit $failed

      # The control: the official v1.0.2 reads saved values in the process's locale, so the check must still find
      # states that load differently under de_DE.UTF-8. If it didn't, the check above would prove nothing.
      - name: Locale, de_DE.UTF-8, official v1.0.2 (must still fail)
        if: ${{ !cancelled() && steps.official.outcome == 'success' && steps.tool.outcome == 'success' }}
        run: |
          failed=0
          for launcher in "" "arch -x86_64"; do
            code=0
            out=$($launcher ci/vst3_check/build/vst3_check locale official/wolf-shaper.vst3 de_DE.UTF-8 ci/frozen/states/*.vst3state 2>&1) || code=$?
            echo "::group::official ${launcher:-arm64}"
            echo "$out"
            echo "::endgroup::"
            result=$(grep '^RESULT' <<<"$out" | tail -n 1) || true
            if [ "$code" -eq 1 ] && grep -q -E '^RESULT locale FAIL [1-9][0-9]* of [0-9]+ states load or save differently' <<<"$result"; then
              echo "official ${launcher:-arm64}: fails as expected: $result"
            else
              echo "official ${launcher:-arm64}: FAIL, the control didn't find the locale problem: $result"
              failed=1
            fi
          done
          exit $failed

      # The macOS installer, unsigned (packaging/macos, ci/README.md): one package that installs our VST3 into
      # /Library/Audio/Plug-Ins/VST3 with its licenses, credits and source link. It's installed on this runner (clean,
      # and over the official v1.0.2 installer), checked there and uninstalled again.
      - name: macOS installer, build (unsigned)
        id: pkg
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash packaging/macos/make_pkg.sh bin/wolf-shaper.vst3 "$PKG_VERSION" dist-pkg/wolf-shaper-macos-unsigned.pkg

      - name: macOS installer, install, check and uninstall
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' && steps.tool.outcome == 'success' && steps.official.outcome == 'success' }}
        run: bash ci/check_pkg.sh ci/vst3_check/build/vst3_check dist-pkg/wolf-shaper-macos-unsigned.pkg "$PKG_VERSION" bin/wolf-shaper.vst3 official/wolf-shaper-AudioPlugins.pkg

      # Signing changes nothing in the program but its signature; ci/macho_same_code.py proves that for every signed
      # copy. Its self-test: one changed byte in the code, the data or __LINKEDIT must be found, changed bytes inside a
      # signature must not count, and the official v1.0.2 must come out different from our build.
      - name: Code comparison self-test
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.official.outcome == 'success' }}
        run: |
          python3 ci/macho_same_code.py --self-test bin/wolf-shaper.vst3/Contents/MacOS/wolf-shaper
          code=0
          python3 ci/macho_same_code.py bin/wolf-shaper.vst3/Contents/MacOS/wolf-shaper official/wolf-shaper.vst3/Contents/MacOS/wolf-shaper || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::the comparison didn't find the official v1.0.2 different from our build (exit $code)"
            exit 1
          fi
          echo "PASS the official v1.0.2 comes out different from our build"

      # The signing rehearsal (ci/README.md, "Signing"): throwaway identities that no Mac trusts go through the same
      # keychain, signing and install code as the Developer ID certificates in the macos-release job. Nothing from
      # the rehearsal is uploaded. Not on pull requests: no signing runs there.
      - name: Signing rehearsal, throwaway identities in a temporary keychain
        id: rehearsal_keychain
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' && github.event_name != 'pull_request' }}
        run: |
          REHEARSAL_P12_PASSWORD=$(openssl rand -hex 16)
          export REHEARSAL_P12_PASSWORD
          echo "::add-mask::$REHEARSAL_P12_PASSWORD"
          d="$RUNNER_TEMP/rehearsal-identities"
          bash ci/make_test_identity.sh "$d"
          bash ci/keychain.sh setup "$RUNNER_TEMP/rehearsal.keychain-db" rehearsal \
            "$d/application.p12:REHEARSAL_P12_PASSWORD" "$d/installer.p12:REHEARSAL_P12_PASSWORD"
          rm -rf "$d"

      # The plugin is signed with the throwaway identity; the installer itself stays unsigned here, because productbuild
      # signs only with an installer certificate the Mac trusts (Apple's, in the macos-release job).
      - name: Signing rehearsal, build the installer with the signed plugin
        id: rehearsal_pkg
        if: ${{ !cancelled() && steps.rehearsal_keychain.outcome == 'success' }}
        env:
          SIGN_APP_IDENTITY: ${{ steps.rehearsal_keychain.outputs.app_identity }}
          SIGN_KEYCHAIN: ${{ steps.rehearsal_keychain.outputs.keychain }}
        run: bash packaging/macos/make_pkg.sh bin/wolf-shaper.vst3 "$PKG_VERSION" "$RUNNER_TEMP/rehearsal-pkg/wolf-shaper-macos-rehearsal.pkg"

      - name: Signing rehearsal, signature checks
        if: ${{ !cancelled() && steps.rehearsal_pkg.outcome == 'success' }}
        run: bash ci/check_signed_pkg.sh rehearsal "$RUNNER_TEMP/rehearsal-pkg/wolf-shaper-macos-rehearsal.pkg"

      - name: Signing rehearsal, install, check and uninstall
        if: ${{ !cancelled() && steps.rehearsal_pkg.outcome == 'success' && steps.tool.outcome == 'success' && steps.official.outcome == 'success' }}
        env:
          PKG_SIGNED: rehearsal
          PKG_RUN_NAME: pkg-rehearsal
        run: bash ci/check_pkg.sh ci/vst3_check/build/vst3_check "$RUNNER_TEMP/rehearsal-pkg/wolf-shaper-macos-rehearsal.pkg" "$PKG_VERSION" bin/wolf-shaper.vst3 official/wolf-shaper-AudioPlugins.pkg

      - name: Signing rehearsal, delete the keychain
        if: ${{ always() && steps.rehearsal_keychain.outcome != 'skipped' }}
        run: |
          bash ci/keychain.sh delete "$RUNNER_TEMP/rehearsal.keychain-db"
          rm -rf "$RUNNER_TEMP/rehearsal-identities" "$RUNNER_TEMP/rehearsal-pkg"

      - name: macOS installer, photos of its first pages (report only)
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: bash ci/photo_installer.sh dist-pkg/wolf-shaper-macos-unsigned.pkg ci-results/pkg

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        with:
          name: wolf-shaper-pkg-macos-unsigned
          path: dist-pkg
          retention-days: 7

      - name: Keep our block-512 renders for the comparison with Windows
        if: ${{ !cancelled() && steps.signal.outcome == 'success' }}
        run: |
          mkdir -p sound-upload
          for arch in arm64 x86_64; do
            [ -d sound-renders/macos-$arch-ours ] || continue
            mkdir -p sound-upload/macos-$arch-ours
            cp sound-renders/macos-$arch-ours/*-512.wav sound-upload/macos-$arch-ours/
          done

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.signal.outcome == 'success' }}
        with:
          name: sound-renders-macos
          path: sound-upload
          retention-days: 5
          if-no-files-found: ignore

      - name: Pack our build with its licenses and source link
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash ci/package_artifact.sh bin dist/wolf-shaper-macos-universal "macOS universal (Apple Silicon and Intel)"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: wolf-shaper-vst3-macos-universal
          path: dist/wolf-shaper-macos-universal
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: check-results-macos
          path: ci-results
          retention-days: 30
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq pkg-config libgl-dev mesa-common-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev > /dev/null

      - name: Runner and toolchain
        run: |
          lsb_release -ds
          uname -m
          gcc --version | head -n 1
          make --version | head -n 1
          git -C dpf log -1 --format='dpf %H %s'

      # Static libgcc and libstdc++, like the official v1.0.2 Linux release (DISTRHO/dpf-makefile-action, linux-x86_64).
      - name: Build the VST3
        id: build
        env:
          LDFLAGS: -static-libgcc -static-libstdc++
        run: |
          make $VST3_ONLY features
          make $VST3_ONLY -j"$(nproc)" plugins
          B=bin/wolf-shaper.vst3/Contents/x86_64-linux/wolf-shaper.so
          ldd "$B"
          echo "--- files in the bundle"
          find bin/wolf-shaper.vst3 -type f
          sha256sum "$B"

      - name: Build the check tool
        id: tool
        run: |
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3_pluginterfaces.git ci/vst3_check/sdk/pluginterfaces
          cmake -S ci/vst3_check -B ci/vst3_check/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ci/vst3_check/build --config Release

      - name: Get the official v1.0.2 Linux release
        id: official
        run: |
          mkdir -p official
          gh release download "$OFFICIAL_RELEASE" -R wolf-plugins/wolf-shaper -p wolf-shaper-v1.0.2-linux-x64.zip -D official
          (cd official && cmake -E tar xf wolf-shaper-v1.0.2-linux-x64.zip)
          B=$(find official -type d -name wolf-shaper.vst3 -prune | head -n 1)
          echo "bundle=$B" >> "$GITHUB_OUTPUT"
          echo "--- files in the bundle"
          find "$B" -type f
          sha=$(sha256sum "$B/Contents/x86_64-linux/wolf-shaper.so" | cut -d ' ' -f 1)
          echo "official Linux binary sha256: $sha"
          if [ -z "$OFFICIAL_LINUX_SHA256" ]; then
            echo "::warning::The official Linux binary's sha256 isn't pinned yet: $sha"
          elif [ "$sha" != "$OFFICIAL_LINUX_SHA256" ]; then
            echo "::error::The official Linux binary isn't the one pinned in this workflow"
            exit 1
          fi

      - name: Checks, our build
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tool.outcome == 'success' }}
        run: bash ci/run_checks.sh ci/vst3_check/build/vst3_check bin/wolf-shaper.vst3 ours linux-x64-ours

      - name: Checks, official v1.0.2
        if: ${{ !cancelled() && steps.official.outcome == 'success' && steps.tool.outcome == 'success' }}
        run: bash ci/run_checks.sh ci/vst3_check/build/vst3_check "${{ steps.official.outputs.bundle }}" official linux-x64-official

      - name: Self-test (each check must fail on wrong frozen values)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tool.outcome == 'success' }}
        run: bash ci/self_test.sh ci/vst3_check/build/vst3_check bin/wolf-shaper.vst3

      - name: Pack our build with its licenses and source link
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash ci/package_artifact.sh bin dist/wolf-shaper-linux-x64 "Linux x64"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: wolf-shaper-vst3-linux-x64
          path: dist/wolf-shaper-linux-x64
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: check-results-linux
          path: ci-results
          retention-days: 30
          if-no-files-found: ignore

  windows-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MinGW-w64 cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq binutils-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64 > /dev/null
          lsb_release -ds
          x86_64-w64-mingw32-g++ --version | head -n 1
          git -C dpf log -1 --format='dpf %H %s'

      # Cross-compiled with MinGW-w64, like the official v1.0.2 Windows release (DISTRHO/dpf-makefile-action, win64).
      - name: Build the VST3 (Windows x64)
        env:
          AR: x86_64-w64-mingw32-ar
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          PKG_CONFIG: 'false'
        run: |
          make $VST3_ONLY features
          make $VST3_ONLY -j"$(nproc)" plugins
          B=bin/wolf-shaper.vst3/Contents/x86_64-win/wolf-shaper.vst3
          echo "--- DLLs it needs"
          x86_64-w64-mingw32-objdump -p "$B" | grep "DLL Name" || true
          echo "--- files in the bundle"
          find bin/wolf-shaper.vst3 -type f
          sha256sum "$B"

      - name: Pack our build with its licenses and source link
        run: bash ci/package_artifact.sh bin dist/wolf-shaper-windows-x64 "Windows x64"

      - uses: actions/upload-artifact@v4
        with:
          name: wolf-shaper-vst3-windows-x64
          path: dist/wolf-shaper-windows-x64
          retention-days: 30

  windows:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wolf-shaper-vst3-windows-x64
          path: ours

      - name: Our build
        run: |
          echo "--- files in our bundle"
          find ours/wolf-shaper.vst3 -type f
          sha256sum ours/wolf-shaper.vst3/Contents/x86_64-win/wolf-shaper.vst3

      - name: Build the check tool
        id: tool
        run: |
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3_pluginterfaces.git ci/vst3_check/sdk/pluginterfaces
          cmake -S ci/vst3_check -B ci/vst3_check/build
          cmake --build ci/vst3_check/build --config Release

      - name: Get the official v1.0.2 Windows release
        id: official
        run: |
          mkdir -p official
          gh release download "$OFFICIAL_RELEASE" -R wolf-plugins/wolf-shaper -p "wolf-shaper-v1.0.2+20230515144200-windows-x64.zip" -D official
          (cd official && cmake -E tar xf "wolf-shaper-v1.0.2+20230515144200-windows-x64.zip")
          B=$(find official -type d -name wolf-shaper.vst3 -prune | head -n 1)
          echo "bundle=$B" >> "$GITHUB_OUTPUT"
          echo "--- files in the bundle"
          find "$B" -type f
          echo "$OFFICIAL_WINDOWS_SHA256 *$B/Contents/x86_64-win/wolf-shaper.vst3" | sha256sum -c

      - name: Checks, our build
        if: ${{ !cancelled() && steps.tool.outcome == 'success' }}
        run: bash ci/run_checks.sh ci/vst3_check/build/Release/vst3_check.exe ours/wolf-shaper.vst3 ours windows-x64-ours

      - name: Checks, official v1.0.2
        if: ${{ !cancelled() && steps.official.outcome == 'success' && steps.tool.outcome == 'success' }}
        run: bash ci/run_checks.sh ci/vst3_check/build/Release/vst3_check.exe "${{ steps.official.outputs.bundle }}" official windows-x64-official

      # The sound, as on macOS (ci/README.md). The official v1.0.2's renders are the Windows side of the comparison.
      - name: Test signal
        id: signal
        if: ${{ !cancelled() }}
        run: |
          python ci/make_test_signal.py sound-signal
          (cd sound-signal && sha256sum -c ../ci/frozen/test-signal.sha256)

      - name: Sound, official v1.0.2
        if: ${{ !cancelled() && steps.official.outcome == 'success' && steps.tool.outcome == 'success' && steps.signal.outcome == 'success' }}
        run: bash ci/run_sound_checks.sh ci/vst3_check/build/Release/vst3_check.exe "${{ steps.official.outputs.bundle }}" windows-x64-official sound-signal sound-renders

      - name: Sound, our build
        if: ${{ !cancelled() && steps.tool.outcome == 'success' && steps.signal.outcome == 'success' }}
        run: bash ci/run_sound_checks.sh ci/vst3_check/build/Release/vst3_check.exe ours/wolf-shaper.vst3 windows-x64-ours sound-signal sound-renders

      - name: Sound, our build against the official v1.0.2 (bit for bit)
        if: ${{ !cancelled() && steps.signal.outcome == 'success' }}
        run: |
          python ci/null_test.py --identical --label "Windows: our build against the official v1.0.2" --dirs sound-renders/windows-x64-official sound-renders/windows-x64-ours

      - name: Keep the block-512 renders for the comparison with macOS
        if: ${{ !cancelled() && steps.signal.outcome == 'success' }}
        run: |
          mkdir -p sound-upload
          for build in official ours; do
            [ -d sound-renders/windows-x64-$build ] || continue
            mkdir -p sound-upload/windows-x64-$build
            cp sound-renders/windows-x64-$build/*-512.wav sound-upload/windows-x64-$build/
          done

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.signal.outcome == 'success' }}
        with:
          name: sound-renders-windows
          path: sound-upload
          retention-days: 5
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: check-results-windows
          path: ci-results
          retention-days: 30
          if-no-files-found: ignore

  # Private states (saved by users of the plugin) through our macOS build, for the null test against Windows, and
  # checked like the public ones: each loads under de_DE.UTF-8 as under "C" and saves back byte for byte. They come
  # from the private-tests environment, which only sw/* branches can use and which pull requests never reach. Nothing
  # readable leaves the job: ci/run_private_sound.sh keeps every render and log in a temporary folder, encrypts them
  # to a public key, and prints counts only. The encrypted results are uploaded even when a check fails, for diagnosis.
  macos-private:
    needs: macos
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.repository == 'sonic-weaponry/wolf-shaper' }}
    runs-on: macos-latest
    environment: private-tests
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wolf-shaper-vst3-macos-universal
          path: ours

      - name: Our build (from the macos job)
        run: |
          chmod +x ours/wolf-shaper.vst3/Contents/MacOS/wolf-shaper
          shasum -a 256 ours/wolf-shaper.vst3/Contents/MacOS/wolf-shaper
          command -v gpg >/dev/null || brew install gnupg
          gpg --version | head -n 1

      - name: Build the check tool (universal)
        run: |
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3_pluginterfaces.git ci/vst3_check/sdk/pluginterfaces
          cmake -S ci/vst3_check -B ci/vst3_check/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ci/vst3_check/build --config Release

      - name: Get the official v1.0.2 macOS release
        run: |
          mkdir -p official
          gh release download "$OFFICIAL_RELEASE" -R wolf-plugins/wolf-shaper -p wolf-shaper-v1.0.2-macos-universal.zip -D official
          cd official
          cmake -E tar xf wolf-shaper-v1.0.2-macos-universal.zip
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/wsdmg ./*.dmg
          pkgutil --expand-full /tmp/wsdmg/wolf-shaper-AudioPlugins.pkg pkg
          hdiutil detach /tmp/wsdmg
          cp -R "$(find pkg/dpf-wolf-shaper-vst3bundles.pkg -type d -name wolf-shaper.vst3 | head -n 1)" ./wolf-shaper.vst3
          echo "$OFFICIAL_MAC_SHA256  wolf-shaper.vst3/Contents/MacOS/wolf-shaper" | shasum -a 256 -c

      - name: Test signal
        run: |
          python3 ci/make_test_signal.py sound-signal
          (cd sound-signal && shasum -a 256 -c ../ci/frozen/test-signal.sha256)

      - name: Private states (results leave encrypted)
        env:
          PRIVATE_STATES: ${{ secrets.PRIVATE_STATES }}
          RENDER_PUBLIC_KEY: ${{ secrets.RENDER_PUBLIC_KEY }}
        run: bash ci/run_private_sound.sh ci/vst3_check/build/vst3_check ours/wolf-shaper.vst3 official/wolf-shaper.vst3 sound-signal "$RUNNER_TEMP/private-results.tar.gz.gpg"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: private-results-encrypted
          path: ${{ runner.temp }}/private-results.tar.gz.gpg
          retention-days: 3
          if-no-files-found: error

  # The public test states, macOS against Windows: our macOS build (arm64 and x86_64) against the official v1.0.2 and
  # our build on Windows, all rendered with ci/vst3_check at block 512. Every residual must stay below -100 dBFS
  # (measured: -110.5 dBFS at worst).
  sound-compare:
    needs: [macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sound-renders-macos
          path: renders

      - uses: actions/download-artifact@v4
        with:
          name: sound-renders-windows
          path: renders

      - name: macOS against Windows
        run: |
          for arch in arm64 x86_64; do
            python3 ci/null_test.py --limit -100 --label "our macOS build ($arch) against the official v1.0.2 on Windows" --dirs renders/windows-x64-official renders/macos-$arch-ours
          done
          python3 ci/null_test.py --limit -100 --label "our macOS build (arm64) against our Windows build" --dirs renders/windows-x64-ours renders/macos-arm64-ours

  # The signed, notarized and stapled macOS installer (ci/README.md, "Signing"). Only when the workflow is started by
  # hand with sign=true on an sw/ branch, and only after every other job of the run passed. It signs the build the macos
  # job checked. The mac-release environment, which holds the Developer ID certificates and the notarization key,
  # accepts only sw/* branches and v* tags. Nothing here prints a secret, and the keychain and the key file are deleted
  # at the end, also after a failure.
  macos-release:
    needs: [macos, linux, windows, macos-private, sound-compare]
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.sign &&
      github.repository == 'sonic-weaponry/wolf-shaper' && startsWith(github.ref, 'refs/heads/sw/') &&
      needs.macos.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' &&
      needs.macos-private.result == 'success' && needs.sound-compare.result == 'success' }}
    runs-on: macos-latest
    environment: mac-release
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      # Whose name the Developer ID certificates must carry (the membership is being converted to the company's).
      EXPECTED_SIGNER: SONIC WEAPONRY LLC
      PKG: dist-release/wolf-shaper-macos-signed.pkg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: wolf-shaper-vst3-macos-universal
          path: ours

      - name: Our build (the one the macos job checked)
        env:
          BUILT_SHA256: ${{ needs.macos.outputs.binary_sha256 }}
        run: |
          chmod +x ours/wolf-shaper.vst3/Contents/MacOS/wolf-shaper
          echo "$BUILT_SHA256  ours/wolf-shaper.vst3/Contents/MacOS/wolf-shaper" | shasum -a 256 -c
          find ours/wolf-shaper.vst3 -type f

      - name: Build the check tool (universal)
        run: |
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3_pluginterfaces.git ci/vst3_check/sdk/pluginterfaces
          cmake -S ci/vst3_check -B ci/vst3_check/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ci/vst3_check/build --config Release

      - name: Get the official v1.0.2 macOS release
        run: |
          mkdir -p official
          gh release download "$OFFICIAL_RELEASE" -R wolf-plugins/wolf-shaper -p wolf-shaper-v1.0.2-macos-universal.zip -D official
          cd official
          cmake -E tar xf wolf-shaper-v1.0.2-macos-universal.zip
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/wsdmg ./*.dmg
          pkgutil --expand-full /tmp/wsdmg/wolf-shaper-AudioPlugins.pkg pkg
          cp /tmp/wsdmg/wolf-shaper-AudioPlugins.pkg .
          hdiutil detach /tmp/wsdmg
          cp -R "$(find pkg/dpf-wolf-shaper-vst3bundles.pkg -type d -name wolf-shaper.vst3 | head -n 1)" ./wolf-shaper.vst3
          echo "$OFFICIAL_MAC_SHA256  wolf-shaper.vst3/Contents/MacOS/wolf-shaper" | shasum -a 256 -c

      - name: Signing keychain (Developer ID certificates)
        id: keychain
        env:
          MACOS_CERT_APPLICATION_P12: ${{ secrets.MACOS_CERT_APPLICATION_P12 }}
          MACOS_CERT_APPLICATION_PASSWORD: ${{ secrets.MACOS_CERT_APPLICATION_PASSWORD }}
          MACOS_CERT_INSTALLER_P12: ${{ secrets.MACOS_CERT_INSTALLER_P12 }}
          MACOS_CERT_INSTALLER_PASSWORD: ${{ secrets.MACOS_CERT_INSTALLER_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERT_APPLICATION_P12" ] || [ -z "$MACOS_CERT_INSTALLER_P12" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::The mac-release environment has no signing certificates or Team ID yet (WAITING_ON_ME W2 to W4)."
            exit 1
          fi
          umask 077
          d="$RUNNER_TEMP/signing"
          mkdir -p "$d"
          printf '%s' "$MACOS_CERT_APPLICATION_P12" | base64 --decode >"$d/application.p12"
          printf '%s' "$MACOS_CERT_INSTALLER_P12" | base64 --decode >"$d/installer.p12"
          bash ci/keychain.sh setup "$RUNNER_TEMP/signing.keychain-db" developer-id \
            "$d/application.p12:MACOS_CERT_APPLICATION_PASSWORD" "$d/installer.p12:MACOS_CERT_INSTALLER_PASSWORD"
          rm -f "$d/application.p12" "$d/installer.p12"

      - name: Build the signed installer
        id: pkg
        env:
          SIGN_APP_IDENTITY: ${{ steps.keychain.outputs.app_identity }}
          SIGN_INSTALLER_IDENTITY: ${{ steps.keychain.outputs.installer_name }}
          SIGN_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: bash packaging/macos/make_pkg.sh ours/wolf-shaper.vst3 "$PKG_VERSION" "$PKG"

      - name: Signatures (before notarization)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ci/check_signed_pkg.sh developer-id "$PKG"

      - name: Notarize and staple
        id: notarize
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "::error::The mac-release environment has no notarization key yet (WAITING_ON_ME W3 and W4)."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/notary"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" >"$APPLE_API_KEY_PATH"
          bash packaging/macos/notarize.sh "$PKG" dist-release/notarization

      - name: Signatures, notarization, staple and Gatekeeper
        if: ${{ !cancelled() && steps.notarize.outcome == 'success' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ci/check_signed_pkg.sh developer-id "$PKG" dist-release/notarization

      - name: The stapled installer, install, check and uninstall
        if: ${{ !cancelled() && steps.notarize.outcome == 'success' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PKG_SIGNED: developer-id
          PKG_RUN_NAME: pkg-release
        run: bash ci/check_pkg.sh ci/vst3_check/build/vst3_check "$PKG" "$PKG_VERSION" ours/wolf-shaper.vst3 official/wolf-shaper-AudioPlugins.pkg

      # Report only, for a zip download of the plugin in R8: Apple's ticket also covers the plugin itself.
      - name: Staple a copy of the plugin itself (report only)
        if: ${{ !cancelled() && steps.notarize.outcome == 'success' }}
        continue-on-error: true
        run: |
          d=$(mktemp -d)
          pkgutil --expand-full "$PKG" "$d/expanded"
          ditto "$d/expanded/dpf-wolf-shaper-vst3bundles.pkg/Payload/wolf-shaper.vst3" "$d/wolf-shaper.vst3"
          code=0
          xcrun stapler staple -v "$d/wolf-shaper.vst3" && xcrun stapler validate -v "$d/wolf-shaper.vst3" || code=$?
          echo "REPORT stapling the plugin bundle itself: exit $code"
          rm -rf "$d"

      - name: SHA-256 of the installer
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        run: |
          cd dist-release
          shasum -a 256 ./*.pkg | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.notarize.outcome == 'success' }}
        with:
          name: wolf-shaper-pkg-macos-notarized
          path: dist-release
          retention-days: 30

      # Kept for diagnosis only: signed but not notarized (Apple rejected it or hadn't finished). Never hand it out.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' && steps.notarize.outcome != 'success' }}
        with:
          name: wolf-shaper-pkg-macos-signed-NOT-notarized
          path: dist-release
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: check-results-macos-release
          path: ci-results
          retention-days: 30
          if-no-files-found: ignore

      - name: Delete the keychain and the API key
        if: ${{ always() }}
        run: |
          bash ci/keychain.sh delete "$RUNNER_TEMP/signing.keychain-db"
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/notary"
